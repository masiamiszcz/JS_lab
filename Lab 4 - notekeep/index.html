<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FAJNY NOTATNIK</title>
    <link rel="stylesheet" href="site.css">
</head>
<body>
    <header>
        <h1>NotePocket</h1>
    </header>
    <div class="controls">
        <input type="text" id="search" placeholder="Szukaj notatek">
        <input type="text" id="tag-filter" placeholder="Filtruj tagi">
    </div>
    <div class="note-form" id="note-form">
        <input type="text" id="tytul" placeholder="Tytuł notatki">
        <textarea id="tresc" placeholder="Treść notatki"></textarea>
        <div id="tasks-container">
            <label>Zadania:</label>
            <div id="tasks-list"></div>
            <button type="button" id="add-task">Dodaj zadanie</button>
        </div>
        <input type="text" id="tagi" placeholder="Tagi (oddzielone przecinkami)">
        <div>
            <label for="kolor">Kolor notatki:</label>
            <input type="color" id="kolor" value="#ffffff">
        </div>
        <div>
            <label for="przypomnienie">Przypomnienie:</label>
            <input type="datetime-local" id="przypomnienie">
        </div>
        <div>
            <label><input type="checkbox" id="przypieta"> Przypnij notatkę</label>
        </div>
        <button type="button" id="zapisz-notatke">Zapisz notatkę</button>
    </div>
    <div id="notes-container" class="notes-grid"></div>
    <script src="main.js" defer></script>
</body>
</html>
